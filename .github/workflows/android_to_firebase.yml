name: Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      version_code:
        description: "Version Code (optional, e.g. 1)"
        required: false
      version_name:
        description: "Version Name (optional, e.g. 1.1.0)"
        required: false
      release_notes:
        description: "Release notes for testers"
        required: false
        default: "Build for QA testing"
      tester_groups:
        description: "Tester Groups (comma-separated, e.g. TapnPay,QA-Team)"
        required: false
        default: "TapnPay"
      tester_emails:
        description: "Individual tester emails (comma-separated). Optional."
        required: false

jobs:
  firebase-distribute:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses

      - name: Install SDK components
        run: |
          sdkmanager --update
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > app/keyGoogleStore.jks

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Build Vado APK
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ "$BUILD_TYPE" == "release" ]; then
            CMD="./gradlew assembleVadoRelease --stacktrace"
          else
            CMD="./gradlew assembleVadoDebug --stacktrace"
          fi
          if [ -n "${{ github.event.inputs.version_code }}" ]; then
            CMD="$CMD -PciVersionCode=${{ github.event.inputs.version_code }}"
          fi
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            CMD="$CMD -PciVersionName=${{ github.event.inputs.version_name }}"
          fi
          eval $CMD
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify APK exists
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          ls -R app/build/outputs/apk/vado/$BUILD_TYPE/

      - name: Verify Firebase App ID is set
        run: |
          if [ -z "${{ secrets.FIREBASE_APP_ID }}" ]; then
            echo "ERROR: FIREBASE_APP_ID secret is not set!"
            exit 1
          fi

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ github.event.inputs.tester_groups }}
          testers: ${{ github.event.inputs.tester_emails }}
          file: app/build/outputs/apk/vado/${{ github.event.inputs.build_type }}/app-vado-${{ github.event.inputs.build_type }}.apk
          releaseNotes: "[${{ github.event.inputs.build_type }}] ${{ github.event.inputs.release_notes }}"
