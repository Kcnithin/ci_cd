name: Android - Firebase App Distribution

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
      version_code:
        description: "Version Code"
        required: true
      version_name:
        description: "Version Name"
        required: true
      release_notes:
        description: "Release notes"
        required: false
        default: "Build for QA testing"
      tester_groups:
        description: "Tester Groups"
        required: false
        default: "sample_ci_cd"
      tester_emails:
        description: "Tester Emails"
        required: false

jobs:
  firebase-distribute:
    runs-on: ubuntu-latest

    steps:
      # ✅ Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ✅ Setup Java
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ✅ Setup Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      # ✅ Install Dependencies
      - name: Flutter Pub Get
        run: flutter pub get

      # ✅ Decode keystore (only for release)
      - name: Decode Keystore
        if: ${{ github.event.inputs.build_type == 'release' }}
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/keystores/cicd-keystore.jks

      # ✅ Build APK (Flutter way ✅)
      - name: Build APK
        run: |
          BUILD_TYPE=${{ github.event.inputs.build_type }}

          if [ "$BUILD_TYPE" == "release" ]; then
            flutter build apk --release
          else
            flutter build apk --debug
          fi
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # ✅ Verify APK
      - name: Verify APK
        run: |
          ls -R build/app/outputs/flutter-apk/

      # ✅ Upload to Firebase
      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: ${{ github.event.inputs.tester_groups }}
          testers: ${{ github.event.inputs.tester_emails }}
          file: |
            build/app/outputs/flutter-apk/app-${{ github.event.inputs.build_type }}.apk
          releaseNotes: "[${{ github.event.inputs.build_type }}] ${{ github.event.inputs.release_notes }}"
